name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Check that versionName matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          name=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ "$name" != "$version" ]; then
            echo "versionName is $name but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Restore the release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "The RELEASE_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "material-eleven-${GITHUB_REF_NAME}.apk"

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" '
            index($0, head) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Material Eleven $GITHUB_REF_NAME" > notes.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="material-eleven-${GITHUB_REF_NAME}.apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
